name: dike
version: 0.1.0
manifest_version: 2
description: Verify Chilean statutory citations against a local hash-identified corpus; no signing or substantive legal certification.
author: Diké
requires_hermes: ">=0.21.5"
platforms: [linux]
provides_tools: [dike_verificar_citas]
python_dependencies:
  - "pydantic>=2.0,<3"
  - "pyyaml>=6.0,<7"
  - "rich>=13.0,<15"
  - "requests>=2.28,<3"
  - "cryptography>=42.0,<51"
